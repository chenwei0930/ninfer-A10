name: Build ninfer-3090 Docker image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Don-Chad/ninfer-3090 的 Git tag，例如 v0.16.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 检出你自己的仓库，以读取 Dockerfile
      - name: Checkout Dockerfile repository
        uses: actions/checkout@v4

      - name: Validate source tag and make image tag
        id: meta
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail

          # 限制为安全的 Git/Docker tag 字符，避免空值或特殊字符
          if [[ ! "$SOURCE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid source tag: $SOURCE_TAG" >&2
            exit 1
          fi

          image_version="${SOURCE_TAG#v}"
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ninfer-3090"

          echo "image=$image_name" >> "$GITHUB_OUTPUT"
          echo "tag=3090-$image_version" >> "$GITHUB_OUTPUT"

      # 检出用户指定的上游 tag
      - name: Checkout selected ninfer-3090 tag
        uses: actions/checkout@v4
        with:
          repository: Don-Chad/ninfer-3090
          ref: ${{ inputs.source_tag }}
          path: upstream
          fetch-depth: 1

      # 用你自己维护的 Dockerfile 替换上游 Dockerfile
      - name: Use custom Dockerfile
        shell: bash
        run: cp "$GITHUB_WORKSPACE/Dockerfile" "$GITHUB_WORKSPACE/upstream/Dockerfile"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            UPSTREAM_REF=${{ inputs.source_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Don-Chad/ninfer-3090
            org.opencontainers.image.version=${{ inputs.source_tag }}
